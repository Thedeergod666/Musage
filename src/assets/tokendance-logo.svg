       改 #1A1A2E 深 slate 跟 stepfun / siliconflow / volcengine-ark / claude 同款（跟纯黑的区别是
       提一点点蓝紫调，浮窗卡片底色 #0F0F14 上不会跟纯黑"糊"一块儿，肉眼区分度高）。
       整体 scale 0.075 = 36/480 缩放；stroke-width 由 transform 自动按比例缩放到位。 -->
  <rect width="36" height="36" rx="7" fill="#1A1A2E"/>
